name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify backend imports
        run: |
          cd backend
          python -c "from main import app; print('FastAPI app imported successfully')"
          python -c "from models import User, SecurityEvent; print('Models imported successfully')"
          python -c "from auth_service import create_access_token; print('Auth service imported successfully')"

      - name: Run backend tests
        run: |
          cd backend
          pytest tests.py -v
          pytest tests_governance.py -v
          pytest tests_phase2.py -v
          pytest tests_phase3.py -v
          pytest tests_phase4.py -v
          pytest tests_reliability.py -v
          pytest test_security.py -v

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify application startup
        run: |
          cd backend
          python << 'EOF'
import os
os.environ['DATABASE_URL'] = 'sqlite:///:memory:'
from database import init_db
from main import app
from fastapi.testclient import TestClient
init_db()
client = TestClient(app)
response = client.get('/health')
assert response.status_code == 200, f"Health check failed: {response.status_code}"
print('Health check passed')
EOF
