name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify backend imports
        run: |
          cd backend
          python -c "from main import app; print('FastAPI app imported successfully')"
          python -c "from models import User, SecurityEvent; print('Models imported successfully')"
          python -c "from auth_service import create_access_token; print('Auth service imported successfully')"

      - name: Run backend tests
        run: |
          cd backend
          pytest tests.py -v
          pytest tests_governance.py -v
          pytest tests_phase2.py -v
          pytest tests_phase3.py -v
          pytest tests_phase4.py -v
          pytest tests_reliability.py -v
          pytest test_security.py -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  ci:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: CI passed
        run: echo "All checks passed"

